```yaml
version: 2

models:
  - name: stg_cities
    columns:
      - name: city_id
        data_tests: [not_null, unique]

  - name: stg_drivers
    columns:
      - name: driver_id
        data_tests: [not_null, unique]

      - name: vehicle_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['auto', 'mini', 'sedan', 'suv', 'electric']

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'suspended']

  - name: stg_riders
    columns:
      - name: rider_id
        data_tests: [not_null, unique]

      - name: rider_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['bronze', 'silver', 'gold', 'platinum']

  - name: stg_trips
    columns:
      - name: trip_id
        data_tests: [not_null, unique]

      - name: rider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_riders')
                field: rider_id

      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id

      - name: trip_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['requested', 'accepted', 'cancelled', 'completed']

      - name: surge_multiplier
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1.0"

      - name: final_fare
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [not_null]

      - name: trip_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_trips')
                field: trip_id

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'refunded']

  - name: stg_location_pings
    columns:
      - name: ping_id
        data_tests: [not_null]
```
