version: 2

models:
  # ---- core ----
  - name: dim_date
    columns:
      - name: date_sk
        data_tests: [not_null, unique]

      - name: date_day
        data_tests: [not_null, unique]

  - name: dim_city
    columns:
      - name: city_sk
        data_tests: [not_null, unique]

      - name: city_business_key
        data_tests: [not_null]

  - name: dim_driver_scd2
    columns:
      - name: driver_sk
        data_tests: [not_null, unique]

      - name: driver_business_key
        data_tests: [not_null]

  - name: dim_rider_scd2
    columns:
      - name: rider_sk
        data_tests: [not_null, unique]

      - name: rider_business_key
        data_tests: [not_null]

  - name: fct_trips
    description: "Trip fact, incremental on _loaded_at, clustered by request_date"
    columns:
      - name: trip_id
        data_tests: [not_null, unique]

      - name: driver_business_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver_scd2')
                field: driver_business_key

      - name: rider_business_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rider_scd2')
                field: rider_business_key

      - name: surge_multiplier
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1.0"

  - name: fct_payments
    columns:
      - name: payment_id
        data_tests: [not_null]

      - name: trip_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_trips')
                field: trip_id

  - name: fct_driver_pings_hourly_baseline
    description: "BASELINE for the empirical study — incremental, refreshed on Airflow schedule"
    columns:
      - name: driver_id
        data_tests: [not_null]

      - name: ping_hour
        data_tests: [not_null]

  # ---- operations ----
  - name: mart_driver_utilization_baseline
    description: "BASELINE driver utilisation, 24-hour rolling window"
    columns:
      - name: driver_id
        data_tests: [not_null, unique]

  - name: mart_surge_heatmap_5min_baseline
    description: "BASELINE 5-minute surge heatmap"

  - name: mart_eta_accuracy_by_city

  # ---- finance ----
  - name: mart_revenue_per_city_daily

  - name: mart_rider_30day_churn
    columns:
      - name: rider_id
        data_tests: [not_null, unique]

      - name: activity_band
        data_tests:
          - accepted_values:
              arguments:
                values: ['never_rode', 'active', 'recent', 'lapsing', 'churned']

  # ---- executive ----
  - name: mart_executive_kpi_weekly

exposures:
  - name: operations_dashboard
    type: dashboard
    maturity: high
    description: "Live operations dashboard — driver utilisation, surge heatmap, ETA accuracy"
    depends_on:
      - ref('mart_driver_utilization_baseline')
      - ref('mart_surge_heatmap_5min_baseline')
      - ref('mart_eta_accuracy_by_city')
    owner:
      name: MSc Capstone
      email: msc.student@example.com

  - name: executive_kpi_dashboard
    type: dashboard
    maturity: high
    description: "Weekly executive KPI rollup"
    depends_on:
      - ref('mart_executive_kpi_weekly')
      - ref('mart_revenue_per_city_daily')
    owner:
      name: MSc Capstone
      email: msc.student@example.com

